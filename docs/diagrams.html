<h2>2. Alur data simulasi playground</h2>
<figure>
<svg width="860" height="210" viewBox="0 0 860 210" role="img" aria-label="Diagram alur data simulasi">
  <defs>
    <marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#177245" />
    </marker>
  </defs>
  <rect x="20" y="70" width="150" height="70" rx="6" fill="#FFFDF8" stroke="#211D19" stroke-width="1.5" />
  <text x="95" y="100" text-anchor="middle" font-size="13" font-weight="700">Slider pendapatan</text>
  <text x="95" y="120" text-anchor="middle" font-size="12">Rp 5–50 jt (15)</text>

  <rect x="20" y="150" width="150" height="0" fill="none" />
  <rect x="230" y="70" width="150" height="70" rx="6" fill="#FFFDF8" stroke="#211D19" stroke-width="1.5" />
  <text x="305" y="100" text-anchor="middle" font-size="13" font-weight="700">Slider utang</text>
  <text x="305" y="120" text-anchor="middle" font-size="12">Rp 1–30 jt (5)</text>

  <rect x="440" y="70" width="170" height="70" rx="6" fill="#177245" />
  <text x="525" y="100" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFDF8">surplus = max(0, P − U)</text>
  <text x="525" y="120" text-anchor="middle" font-size="12" fill="#FFFDF8">invested = surplus × 0,5</text>

  <rect x="670" y="70" width="170" height="70" rx="6" fill="#FFFDF8" stroke="#177245" stroke-width="2" />
  <text x="755" y="100" text-anchor="middle" font-size="13" font-weight="700">aset 12 bln</text>
  <text x="755" y="120" text-anchor="middle" font-size="12">invested × 12 × 1,08</text>

  <line x1="170" y1="105" x2="228" y2="105" stroke="#177245" stroke-width="2" marker-end="url(#arr2)" />
  <line x1="380" y1="105" x2="438" y2="105" stroke="#177245" stroke-width="2" marker-end="url(#arr2)" />
  <line x1="610" y1="105" x2="668" y2="105" stroke="#177245" stroke-width="2" marker-end="url(#arr2)" />

  <text x="430" y="180" text-anchor="middle" font-size="13">Bila surplus ≤ 0 → tampil "Defisit Finansial", bukan angka. Semua angka

</svg>
<figcaption>Gambar 2 — Dua slider → satu rumus → dua kartu struk (hero dan
playground memakai state yang sama).</figcaption>
